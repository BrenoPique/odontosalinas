deployment:
  tasks:
    - export DEPLOYPATH=/home/wwwodontosalinas/public_html
    - /bin/cp -f index.html $DEPLOYPATH/
    - /bin/cp -f tratamentos.html $DEPLOYPATH/
    - /bin/cp -f robots.txt $DEPLOYPATH/
    - /bin/cp -f .cpanel.yml $DEPLOYPATH/
    - /bin/cp -f .htaccess $DEPLOYPATH/
    - /bin/cp -R assets $DEPLOYPATH/